<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Moonlit Meditation: WebXR Walkthrough</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8WRXGV06E1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-8WRXGV06E1');
    </script>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>
    <script src="../shared/vr-exit.js"></script>

    <!-- The hall's light is BAKED. In VRChat it is 48 lights (moon, candles, andons,
         ceiling coves, garden lamps) baked by Unity; here the same table, plus the 60
         lanterns aloft, was baked in Cycles into one 4096 lightmap (lm.jpg) on the
         GLB's second UV set (TEXCOORD_1). The scene ships no real-time lights at all,
         which is what keeps it smooth on a standalone headset.
         lm.jpg stores half the baked value in sRGB, so values up to 2.0 survive 8 bits;
         three.js lights a lightmapped surface as albedo * texel * intensity / pi, so
         intensity = pi / 0.5 reproduces the bake. -->
    <script>
    AFRAME.registerComponent('baked-lightmap', {
      schema: { src: { type: 'string' }, scale: { default: 0.5 }, gain: { default: 1.0 }, env: { default: 0.35 } },
      init: function () {
        var self = this, model = null, tex = null;
        function apply() {
          if (!model || !tex) return;
          var n = 0, seen = new Set();
          model.traverse(function (o) {
            if (!o.isMesh || !o.geometry.attributes.uv1) return;
            (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) {
              if (seen.has(m.uuid)) return; seen.add(m.uuid); n++;
              m.lightMap = tex;
              m.lightMapIntensity = Math.PI / self.data.scale * self.data.gain;
              m.envMapIntensity = self.data.env;   // the sky's light is already in the bake
              m.needsUpdate = true;
            });
          });
          console.log('[baked-lightmap] applied to ' + n + ' materials');
        }
        new THREE.TextureLoader().load(this.data.src, function (t) {
          t.flipY = false;                  // glTF UV convention, like every GLTFLoader texture
          t.channel = 1;                    // TEXCOORD_1
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 4;
          tex = t; apply();
        });
        this.el.addEventListener('model-loaded', function (e) { model = e.detail.model; apply(); });
      }
    });
    </script>

    <!-- The night panorama (moon, Milky Way, the peak and the forest), rendered in Cycles
         from the hall's centre and shipped linear to sRGB with no tone curve, as VRChat
         shows it. It is both scene.background and scene.environment, so the glass, the
         lake and the glossy wood reflect the real sky. The panorama's convention is
         u = -azimuth / 2pi; three.js reads equirects half a turn round from that, hence
         the 180 degree rotation. -->
    <script>
    AFRAME.registerComponent('photo-environment', {
      schema: { src: { type: 'string' }, rotation: { default: 180 } },
      init: function () {
        var scene = this.el.sceneEl.object3D, rot = this.data.rotation;
        new THREE.TextureLoader().load(this.data.src, function (tex) {
          tex.mapping = THREE.EquirectangularReflectionMapping;
          tex.colorSpace = THREE.SRGBColorSpace;
          scene.background = tex;
          scene.environment = tex;
          scene.backgroundRotation = new THREE.Euler(0, THREE.MathUtils.degToRad(rot), 0);
          scene.environmentRotation = scene.backgroundRotation;
        });
      }
    });
    </script>

    <!-- On-screen joystick for phones (inert on desktop / in VR). Registers before the scene parses. -->
    <script>
    AFRAME.registerComponent('touch-move', {
      schema: { speed: { default: 2.2 }, cameraEl: { type: 'selector', default: '#camera' } },
      init: function () {
        this.vec = { x: 0, y: 0 }; this.dragging = false;
        this._fwd = new THREE.Vector3(); this._right = new THREE.Vector3(); this._q = new THREE.Quaternion();
        if (!(('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return; // desktop keeps WASD
        var base = document.createElement('div'); base.className = 'tm-joy-base';
        var thumb = document.createElement('div'); thumb.className = 'tm-joy-thumb';
        base.appendChild(thumb); document.body.appendChild(base); this.base = base;
        var self = this, radius = 55;
        function setFromTouch(t) {
          var r = base.getBoundingClientRect();
          var dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
          var c = Math.min(Math.hypot(dx, dy), radius), a = Math.atan2(dy, dx);
          var tx = Math.cos(a) * c, ty = Math.sin(a) * c;
          thumb.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
          self.vec.x = tx / radius; self.vec.y = -ty / radius;
        }
        function reset() { self.dragging = false; self.vec.x = 0; self.vec.y = 0; thumb.style.transform = 'translate(0,0)'; }
        base.addEventListener('touchstart', function (e) { self.dragging = true; setFromTouch(e.changedTouches[0]); e.preventDefault(); e.stopPropagation(); }, { passive: false });
        base.addEventListener('touchmove', function (e) { if (self.dragging) { setFromTouch(e.changedTouches[0]); e.preventDefault(); e.stopPropagation(); } }, { passive: false });
        base.addEventListener('touchend', function (e) { reset(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
        base.addEventListener('touchcancel', reset, { passive: false });
        this.el.sceneEl.addEventListener('enter-vr', function () { base.style.display = 'none'; });
        this.el.sceneEl.addEventListener('exit-vr', function () { base.style.display = 'flex'; });
      },
      tick: function (time, dt) {
        if (!this.dragging || (this.vec.x === 0 && this.vec.y === 0)) return;
        var cam = this.data.cameraEl; if (!cam) return;
        cam.object3D.getWorldQuaternion(this._q);
        this._fwd.set(0, 0, -1).applyQuaternion(this._q); this._fwd.y = 0; this._fwd.normalize();
        this._right.set(1, 0, 0).applyQuaternion(this._q); this._right.y = 0; this._right.normalize();
        var d = this.data.speed * (dt / 1000), p = this.el.object3D.position;
        p.addScaledVector(this._fwd, this.vec.y * d); p.addScaledVector(this._right, this.vec.x * d);
      },
      remove: function () { if (this.base && this.base.parentNode) this.base.parentNode.removeChild(this.base); }
    });
    </script>

    <style>
      html,body{margin:0;height:100%;background:#0b0f16}
      #help{position:fixed;left:12px;bottom:12px;z-index:9999;max-width:340px;padding:12px 14px;
        border-radius:10px;background:rgba(16,18,24,.72);color:#e8e2da;
        font:13px/1.5 system-ui,sans-serif;border:1px solid rgba(160,120,70,.4);
        backdrop-filter:blur(6px);pointer-events:none}
      .tm-joy-base { position: fixed; left: 22px; bottom: 22px; width: 120px; height: 120px;
        border-radius: 50%; z-index: 10000; background: rgba(16,18,24,.45);
        border: 2px solid rgba(160,120,70,.5); display: flex; align-items: center;
        justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
      .tm-joy-thumb { width: 54px; height: 54px; border-radius: 50%;
        background: rgba(255,200,130,.75); box-shadow: 0 0 14px rgba(255,180,90,.6); pointer-events: none; }
    </style>
    <link rel="stylesheet" href="../shared/vr-ui.css" />
  </head>
  <body>
    <a href="../../portfolio/moonlit-meditation/" class="vr-back">← Back to project</a>
    <div id="help">Desktop: WASD + drag to look. Phone: drag the joystick to walk, drag the screen to look. VR: Enter VR, point at the floor, pull the trigger to teleport.</div>

    <a-scene
      background="color: #0b0f16"
      renderer="colorManagement: true; toneMapping: no; antialias: true; sortTransparentObjects: true"
      loading-screen="backgroundColor: #0b0f16; dotsColor: #ffc882">

      <a-assets timeout="60000">
        <a-asset-item id="model" src="moonlit-meditation.glb"></a-asset-item>
      </a-assets>

      <a-entity photo-environment="src: pano.jpg"></a-entity>

      <!-- Any light entity at all stops A-Frame injecting its default pair, which would
           light the baked surfaces a second time. This one adds nothing. -->
      <a-entity light="type: ambient; intensity: 0"></a-entity>

      <a-entity gltf-model="#model" position="0 0 0" baked-lightmap="src: lm.jpg"></a-entity>

      <!-- Invisible teleport target over the hall floor: the hall is centred at Blender
           (-4, 0) with a 12 m radius -> A-Frame x -4, z 0. Kept visible at opacity 0 so
           the raycaster still hits it. -->
      <a-circle class="teleport-floor" radius="11.4" rotation="-90 0 0" position="-4 0.02 0"
                material="shader: flat; opacity: 0; transparent: true"></a-circle>

      <!-- Spawn: on the aisle runner just inside the entrance, behind the back row,
           Blender (6.5, 0) -> A-Frame (6.5, 0). Facing the leader's cushion and the
           lake glass means looking down Blender -X, which is A-Frame -X; the camera's
           default forward is -Z, so the rig is yawed 90 degrees. -->
      <a-entity id="rig" position="6.5 0 0" rotation="0 90 0" touch-move="speed: 2.2">
        <a-entity id="camera" camera="far: 2000" position="0 1.6 0"
                  look-controls="pointerLockEnabled: false"
                  wasd-controls="acceleration: 20; fly: false"></a-entity>
        <a-entity laser-controls="hand: left"  raycaster="objects: .teleport-floor; far: 30"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .teleport-floor"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .teleport-floor; far: 30"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .teleport-floor"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
