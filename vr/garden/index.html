<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Les Jardins de Perséphone: WebXR Walkthrough</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8WRXGV06E1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-8WRXGV06E1');
    </script>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>
    <script src="../shared/vr-exit.js"></script>

    <!-- Sunset gradient sky: a back-side sphere with a 3-stop vertical gradient.
         toneMapped:false keeps the colors vivid no matter the renderer exposure. -->
    <script>
    AFRAME.registerComponent('gradient-sky', {
      schema: {
        top:    { type: 'color', default: '#1b2a5e' },
        middle: { type: 'color', default: '#c25f7d' },
        bottom: { type: 'color', default: '#ffae5c' },
        midPoint: { default: 0.46 },
        exponent: { default: 0.85 },
        radius:   { default: 600 }
      },
      init: function () {
        var d = this.data;
        var uniforms = {
          topColor: { value: new THREE.Color(d.top) },
          midColor: { value: new THREE.Color(d.middle) },
          botColor: { value: new THREE.Color(d.bottom) },
          midPoint: { value: d.midPoint },
          exponent: { value: d.exponent }
        };
        var mat = new THREE.ShaderMaterial({
          side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false, uniforms: uniforms,
          vertexShader: 'varying vec3 vPos; void main(){ vPos = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
          fragmentShader: [
            'uniform vec3 topColor; uniform vec3 midColor; uniform vec3 botColor;',
            'uniform float midPoint; uniform float exponent; varying vec3 vPos;',
            'void main(){',
            '  float h = clamp(vPos.y * 0.5 + 0.5, 0.0, 1.0);',
            '  vec3 col;',
            '  if (h < midPoint) { col = mix(botColor, midColor, pow(h / midPoint, exponent)); }',
            '  else { col = mix(midColor, topColor, pow((h - midPoint) / (1.0 - midPoint), exponent)); }',
            '  gl_FragColor = vec4(col, 1.0);',
            '}'
          ].join('\n')
        });
        var mesh = new THREE.Mesh(new THREE.SphereGeometry(d.radius, 32, 16), mat);
        mesh.frustumCulled = false;
        this.el.setObject3D('mesh', mesh);
      },
      remove: function () { this.el.removeObject3D('mesh'); }
    });
    </script>

    <!-- On-screen joystick for phones (inert on desktop / in VR). Registers before the scene parses. -->
    <script>
    AFRAME.registerComponent('touch-move', {
      schema: { speed: { default: 2.6 }, cameraEl: { type: 'selector', default: '#camera' } },
      init: function () {
        this.vec = { x: 0, y: 0 }; this.dragging = false;
        this._fwd = new THREE.Vector3(); this._right = new THREE.Vector3(); this._q = new THREE.Quaternion();
        if (!(('ontouchstart' in window) || navigator.maxTouchPoints > 0)) return; // desktop keeps WASD
        var base = document.createElement('div'); base.className = 'tm-joy-base';
        var thumb = document.createElement('div'); thumb.className = 'tm-joy-thumb';
        base.appendChild(thumb); document.body.appendChild(base); this.base = base;
        var self = this, radius = 55;
        function setFromTouch(t) {
          var r = base.getBoundingClientRect();
          var dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
          var c = Math.min(Math.hypot(dx, dy), radius), a = Math.atan2(dy, dx);
          var tx = Math.cos(a) * c, ty = Math.sin(a) * c;
          thumb.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
          self.vec.x = tx / radius; self.vec.y = -ty / radius;
        }
        function reset() { self.dragging = false; self.vec.x = 0; self.vec.y = 0; thumb.style.transform = 'translate(0,0)'; }
        base.addEventListener('touchstart', function (e) { self.dragging = true; setFromTouch(e.changedTouches[0]); e.preventDefault(); e.stopPropagation(); }, { passive: false });
        base.addEventListener('touchmove', function (e) { if (self.dragging) { setFromTouch(e.changedTouches[0]); e.preventDefault(); e.stopPropagation(); } }, { passive: false });
        base.addEventListener('touchend', function (e) { reset(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
        base.addEventListener('touchcancel', reset, { passive: false });
        this.el.sceneEl.addEventListener('enter-vr', function () { base.style.display = 'none'; });
        this.el.sceneEl.addEventListener('exit-vr', function () { base.style.display = 'flex'; });
      },
      tick: function (time, dt) {
        if (!this.dragging || (this.vec.x === 0 && this.vec.y === 0)) return;
        var cam = this.data.cameraEl; if (!cam) return;
        cam.object3D.getWorldQuaternion(this._q);
        this._fwd.set(0, 0, -1).applyQuaternion(this._q); this._fwd.y = 0; this._fwd.normalize();
        this._right.set(1, 0, 0).applyQuaternion(this._q); this._right.y = 0; this._right.normalize();
        var d = this.data.speed * (dt / 1000), p = this.el.object3D.position;
        p.addScaledVector(this._fwd, this.vec.y * d); p.addScaledVector(this._right, this.vec.x * d);
      },
      remove: function () { if (this.base && this.base.parentNode) this.base.parentNode.removeChild(this.base); }
    });
    </script>

    <style>
      html,body{margin:0;height:100%;background:#1b2a5e}
      #help{position:fixed;left:12px;bottom:12px;z-index:9999;max-width:340px;padding:12px 14px;
        border-radius:10px;background:rgba(40,26,14,.72);color:#f3e7d4;
        font:13px/1.5 system-ui,sans-serif;border:1px solid rgba(200,150,90,.4);
        backdrop-filter:blur(6px);pointer-events:none}
      .tm-joy-base { position: fixed; left: 22px; bottom: 22px; width: 120px; height: 120px;
        border-radius: 50%; z-index: 10000; background: rgba(40,26,14,.45);
        border: 2px solid rgba(200,150,90,.5); display: flex; align-items: center;
        justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
      .tm-joy-thumb { width: 54px; height: 54px; border-radius: 50%;
        background: rgba(255,196,120,.75); box-shadow: 0 0 14px rgba(255,180,90,.6); pointer-events: none; }
    </style>
    <link rel="stylesheet" href="../shared/vr-ui.css" />
  </head>
  <body>
    <a href="../../portfolio/garden/" class="vr-back">← Back to project</a>
    <div id="help">Desktop: WASD + drag to look. Phone: drag the joystick to walk, drag the screen to look. VR: Enter VR, point at the ground, pull the trigger to teleport. Nine frogs are hiding in the garden — can you spot them?</div>

    <!-- garden.glb is Draco-compressed (KHR_draco_mesh_compression) + WebP textures;
         gltf-model on the scene tells three.js where to fetch the decoder WASM. -->
    <a-scene
      background="color: #1b2a5e"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
      fog="type: exponential; color: #b98a92; density: 0.0035"
      renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 1.1; antialias: true; sortTransparentObjects: true"
      loading-screen="backgroundColor: #1b2a5e; dotsColor: #ffae5c">

      <a-assets timeout="60000">
        <a-asset-item id="model" src="garden.glb"></a-asset-item>
      </a-assets>

      <!-- Sunset gradient skydome (indigo zenith -> rose -> warm horizon). -->
      <a-entity gradient-sky></a-entity>

      <!-- The GLB carries NO lights (they were pruned in the VRChat export this
           build derives from), so the page provides the whole light rig:
           a low warm sun from the west + a hemisphere fill so shadows never
           read pure black. Lantern/ember/wisp glow comes from emissive mats. -->
      <a-entity light="type: directional; color: #ffb36b; intensity: 2.2" position="-60 18 20"></a-entity>
      <a-entity light="type: hemisphere; color: #ffd9a8; groundColor: #2a2418; intensity: 0.55"></a-entity>

      <a-entity gltf-model="#model" position="0 0 0"></a-entity>

      <!-- Invisible teleport target covering the whole 100 x 250 m garden
           footprint (Blender X ±50 / Y ±125 -> A-Frame X ±50 / Z ∓125).
           Keep visible (opacity 0) so the raycaster still hits it. -->
      <a-plane class="teleport-floor" width="102" height="252" rotation="-90 0 0" position="0 0.02 0"
               material="shader: flat; opacity: 0; transparent: true"></a-plane>

      <!-- Spawn: inside the central gazebo, Blender (0, 0), standing on the
           gazebo floor (top at z 0.56) and facing south down the 240 m axis
           toward the peristyle colonnade & reflecting pool. Blender +Y maps to
           A-Frame -Z, so gazebo centre = position (0, _, 0); rig yawed 180°
           faces south (camera default forward -Z = Blender north).
           rig.y = 0.56 sets the feet on the gazebo floor (eye ~2.16 m); VR
           teleports reset the rig to the teleport floor. -->
      <a-entity id="rig" position="0 0.56 0" rotation="0 180 0" touch-move="speed: 2.6">
        <a-entity id="camera" camera="far: 800" position="0 1.6 0"
                  look-controls="pointerLockEnabled: false"
                  wasd-controls="acceleration: 28; fly: false"></a-entity>
        <a-entity laser-controls="hand: left"  raycaster="objects: .teleport-floor; far: 60"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .teleport-floor"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .teleport-floor; far: 60"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .teleport-floor"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
